name: Android

# Pull requests into main are tested and built. A push to main (or a manual run on main) also publishes its APK as a
# release, at the next free version (see MAIN_BUILDS below): signed with the release key, marked latest, with the
# update.json the app's updater reads (native/app/src/main/kotlin/com/example/normpix/updates/). Pushing a version tag
# (v1.1.0, matching versionName in native/app/build.gradle.kts) publishes that version as a release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request replaces its running checks; runs on main and on tags always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Where releases are published, and where the app looks for updates: this repository, or the one named by the
  # UPDATE_REPOSITORY variable. The app reads releases without signing in, so they have to be public (README.md, Releases).
  UPDATE_REPOSITORY: ${{ vars.UPDATE_REPOSITORY || github.repository }}
  # What a push to main publishes: "release" (the app offers it as an update) or "prerelease" (a test build to install by
  # hand, which the app never offers).
  MAIN_BUILDS: release
  # JDK 24 and later warn on every native library a Java program loads (Gradle's own, Robolectric's) unless it is allowed
  # to: GRADLE_OPTS reaches the JVM that starts Gradle, native-access in native/gradle.properties and native/app/build.gradle.kts
  # the daemon and the test JVMs.
  GRADLE_OPTS: --enable-native-access=ALL-UNNAMED
  # The first git of a checkout hints at the name of a new repository's first branch; saying so keeps the log to real news.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  verify:
    name: Tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v5

      # The Gradle daemon asks for JDK 25 (gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      # The output is kept so the step that names failures can point at a compile error too.
      - name: Unit and Robolectric UI tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/tests.log"

      # Runs even when a test fails, so one run reports both.
      - name: Android Lint
        if: ${{ !cancelled() }}
        run: ./gradlew lintDebug

      # Each Kotlin compile error, failed test and lint error is named on the run's page (a compile error or lint error at
      # its line, a test with the start of what it reported), so a red run says what broke without downloading the reports.
      - name: Name what failed
        if: ${{ failure() }}
        env:
          LOG: ${{ runner.temp }}/tests.log
        run: |
          python3 - <<'EOF'
          import glob, os, re, xml.etree.ElementTree as ET

          def data(text):
              return text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          def prop(text):
              return data(text).replace(':', '%3A').replace(',', '%2C')

          root = os.environ['GITHUB_WORKSPACE'].rstrip('/') + '/'
          errors = 0
          if os.path.exists(os.environ['LOG']):
              for line in open(os.environ['LOG'], errors='replace'):
                  m = re.match(r'^e: (?:file://)?(\S+?):(\d+):(\d+) (.*)$', line.rstrip('\n'))
                  if m:
                      errors += 1
                      path = m.group(1).removeprefix(root)
                      print(f"::error file={prop(path)},line={m.group(2)},col={m.group(3)},title=Kotlin::{data(m.group(4))}")

          failed = 0
          for path in sorted(glob.glob('app/build/test-results/**/*.xml', recursive=True)):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for problem in case.findall('failure') + case.findall('error'):
                      failed += 1
                      name = f"{case.get('classname', '').rsplit('.', 1)[-1]} > {case.get('name', '')}"
                      trace = '\n'.join((problem.text or problem.get('message') or '').splitlines()[:120])
                      print(f"::error title={prop(name)}::{data(trace.strip())}")
          lint = 0
          for path in sorted(glob.glob('app/build/reports/lint-results*.xml')):
              for issue in ET.parse(path).getroot().iter('issue'):
                  if issue.get('severity') not in ('Error', 'Fatal'):
                      continue
                  lint += 1
                  where = issue.find('location')
                  file = (where.get('file', '') if where is not None else '').removeprefix(root)
                  line = where.get('line', '1') if where is not None else '1'
                  message = f"{issue.get('id', '')}: {issue.get('message', '')}"
                  print(f"::error file={prop(file)},line={line},title=Lint {prop(issue.get('id', ''))}::{data(message)}")
          print(f"{errors} compile error(s), {failed} failed test(s), {lint} lint error(s)")
          EOF

      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            native/app/build/reports/
            native/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      kind: ${{ steps.version.outputs.kind }}
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A release's notes list the commits since the release before it.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      # A tag is a release, and has to name the version being built. A build of main is a release too (with MAIN_BUILDS set
      # to release), at the next free version: versionName, or the patch after the highest vX.Y.Z tag of its X.Y if that is
      # as high - so every release is newer than the one before, and raising versionName (to 1.1.0, say) starts there.
      # Anything else (a pull request, a branch) is a test build.
      - name: Read the app version
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error::versionName not found in app/build.gradle.kts"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_REF_NAME" = "main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$MAIN_BUILDS" = "release" ]; then
            IFS=. read -r major minor patch <<< "$version"
            highest=$(git tag -l "v$major.$minor.*" | sed -n "s/^v$major\.$minor\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -n 1)
            if [ -n "$highest" ] && [ "$highest" -ge "$patch" ]; then patch=$((highest + 1)); fi
            if [ "$patch" -ge 100 ]; then
              echo "::error title=Out of patch versions::$major.$minor.$patch is past $major.$minor.99. Raise the minor version in versionName (app/build.gradle.kts)."
              exit 1
            fi
            version="$major.$minor.$patch"
            echo "kind=release" >> "$GITHUB_OUTPUT"
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
            echo "apk=NormPix-$version.apk" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            # The build takes this version instead of versionName.
            echo "override=$version" >> "$GITHUB_OUTPUT"
            echo "Releasing main as $version"
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error title=Tag and version differ::The tag $GITHUB_REF_NAME doesn't name versionName $version (app/build.gradle.kts). Tag v$version, or change versionName first."
              exit 1
            fi
            echo "kind=release" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "apk=NormPix-$version.apk" >> "$GITHUB_OUTPUT"
          else
            echo "kind=prerelease" >> "$GITHUB_OUTPUT"
            echo "tag=v$version-build.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "apk=NormPix-$version-build.$GITHUB_RUN_NUMBER.apk" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Every release has to be signed with the same key, or a new APK won't install over the one on the phone.
      - name: Load the signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KIND: ${{ steps.version.outputs.kind }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "NORMPIX_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$KIND" = "release" ]; then
            echo "::error title=No release key::A release has to be signed with the release key. Set the RELEASE_KEYSTORE_* secrets (README.md, Signing key)."
            exit 1
          else
            echo "::warning title=No release key::RELEASE_KEYSTORE_BASE64 is not set, so this APK is signed with the debug key and won't install over the app. See README.md, Signing key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # -PsplitAbis: one APK per phone CPU type (smaller: it holds only that type's libraries, the card scanner's above all)
      # and a universal one with both, which an installed app too old to choose by CPU still downloads.
      - name: Build the release APKs
        env:
          NORMPIX_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          NORMPIX_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          NORMPIX_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # The app looks for updates where this workflow publishes them.
          NORMPIX_UPDATE_REPOSITORY: ${{ env.UPDATE_REPOSITORY }}
          # A release of main is built as the version worked out above; empty otherwise (versionName as written).
          NORMPIX_VERSION_NAME: ${{ steps.version.outputs.override }}
        run: ./gradlew assembleRelease -PsplitAbis

      - name: Collect the APKs
        id: apk
        env:
          APK: ${{ steps.version.outputs.apk }}
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.key.outputs.signed }}
          # The release key's certificate (README.md, Signing key): the one the installed app carries.
          RELEASE_CERT_SHA256: 96b30aae17b879b4854337043b458c2ce6f22ed67b7966384374e7bbb95a3488
          # The phone CPU types a release has an APK for: the release build type's list in native/app/build.gradle.kts (releaseAbis).
          ABIS: arm64-v8a armeabi-v7a
        run: |
          out=app/build/outputs/apk/release
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd "$GITHUB_WORKSPACE/dist"
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"

          # One APK of the release, checked: signed with the release key, and saying what the build was told it is
          # (update.json is written from this, not from the build script). Sets package, code, min_sdk and native.
          check() {
            local file="$1" certs badging
            sha256sum "$file" > "$file.sha256"
            certs=$(java -Xmx1024M -Xss1m --enable-native-access=ALL-UNNAMED -jar "$build_tools/lib/apksigner.jar" verify --print-certs "$file")
            echo "$certs"
            # An APK signed with any other key would not install over the app, so it is never published as the release.
            if [ "$SIGNED" = "true" ] && ! echo "$certs" | grep -q "certificate SHA-256 digest: $RELEASE_CERT_SHA256"; then
              echo "::error title=Wrong signing key::$file is not signed with the release key ($RELEASE_CERT_SHA256). Check the RELEASE_KEYSTORE_* secrets."
              exit 1
            fi
            badging=$("$build_tools/aapt2" dump badging "$file")
            package=$(echo "$badging" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            code=$(echo "$badging" | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")
            name=$(echo "$badging" | sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p")
            min_sdk=$(grep -m 1 -oE "^(minSdkVersion|sdkVersion):'[0-9]+'" <<< "$badging" | grep -oE '[0-9]+')
            native=$(sed -n "s/^native-code: //p" <<< "$badging" | tr -d "'")
            if [ "$name" != "$VERSION" ] || [ -z "$code" ] || [ -z "$package" ] || [ -z "$min_sdk" ]; then
              echo "::error::$file says $package $name ($code, minSdk $min_sdk); expected versionName $VERSION"
              exit 1
            fi
            echo "$file: $package $name ($code), minSdk $min_sdk, native code: ${native:-none}"
          }

          # An APK for each CPU type, holding that type's libraries and no other's.
          apks='{}'
          for abi in $ABIS; do
            built="$GITHUB_WORKSPACE/native/$out/app-$abi-release.apk"
            if [ ! -f "$built" ]; then
              echo "::error::No $abi release APK was built"
              exit 1
            fi
            file="${APK%.apk}-$abi.apk"
            cp "$built" "$file"
            check "$file"
            if [ "$native" != "$abi" ]; then
              echo "::error::$file has native code for '$native', expected only $abi"
              exit 1
            fi
            apks=$(jq -c --arg abi "$abi" --arg apk "$file" --argjson size "$(stat -c %s "$file")" --arg sha "$(cut -d ' ' -f 1 "$file.sha256")" \
              '. + {($abi): {apk: $apk, size: $size, sha256: $sha}}' <<< "$apks")
          done
          echo "$apks" > "$RUNNER_TEMP/apks.json"

          # The universal APK, with every CPU type's libraries: what an installed app that doesn't choose by CPU downloads.
          built="$GITHUB_WORKSPACE/native/$out/app-universal-release.apk"
          if [ ! -f "$built" ]; then
            echo "::error::No universal release APK was built"
            exit 1
          fi
          cp "$built" "$APK"
          check "$APK"
          {
            echo "package=$package"
            echo "code=$code"
            echo "min_sdk=$min_sdk"
            echo "size=$(stat -c %s "$APK")"
            echo "sha256=$(cut -d ' ' -f 1 "$APK.sha256")"
          } >> "$GITHUB_OUTPUT"

      # The app updates only to a release with a higher versionCode than its own: a release that isn't higher than the
      # one before it would never reach anyone.
      - name: Check the version is newer than the latest release
        if: ${{ steps.version.outputs.kind == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.apk.outputs.code }}
        run: |
          if gh release download --repo "$UPDATE_REPOSITORY" --pattern update.json --dir "$RUNNER_TEMP/previous" 2>/dev/null; then
            previous=$(jq -r '.versionCode' "$RUNNER_TEMP/previous/update.json")
            if [ "$CODE" -le "$previous" ]; then
              echo "::error title=Version not newer::versionCode $CODE is not above the latest release's $previous. Raise versionName."
              exit 1
            fi
            echo "versionCode $CODE follows $previous"
          else
            echo "No earlier release with update.json: this is the first."
          fi

      # What changed: an annotated tag's message, or else the commits since the previous release. A line
      # "mandatory: true" in the tag's message marks the release as one the app offers at every launch, even after Later.
      - name: Write the release notes and update.json
        if: ${{ steps.version.outputs.kind == 'release' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.version.outputs.apk }}
          PACKAGE: ${{ steps.apk.outputs.package }}
          CODE: ${{ steps.apk.outputs.code }}
          MIN_SDK: ${{ steps.apk.outputs.min_sdk }}
          SIZE: ${{ steps.apk.outputs.size }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          mandatory=false
          # A pushed tag already exists; a release of main gets its tag when it is published, so its notes start from the commit.
          ref="$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ref="$TAG"
            # The checkout can hold the tag without its message: fetch the tag itself.
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
              message=$(git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN PGP SIGNATURE-----/,$d')
              if grep -qiE '^mandatory:[[:space:]]*true[[:space:]]*$' <<< "$message"; then mandatory=true; fi
              grep -viE '^mandatory:' <<< "$message" > "$notes" || true
            fi
          fi
          if [ ! -s "$notes" ] || ! grep -q '[^[:space:]]' "$notes"; then
            previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "$ref^" 2>/dev/null || true)
            if [ -n "$previous" ]; then range="$previous..$ref"; else range="$ref"; fi
            git log --no-merges -n 60 --pretty='- %s' "$range" > "$notes"
          fi
          cp "$notes" "$GITHUB_WORKSPACE/release-notes.md"
          jq -n \
            --arg app "$PACKAGE" --argjson code "$CODE" --arg name "$VERSION" --arg tag "$TAG" --arg apk "$APK" \
            --argjson size "$SIZE" --arg sha "$SHA256" --argjson minSdk "$MIN_SDK" --argjson mandatory "$mandatory" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --rawfile notes "$notes" --slurpfile apks "$RUNNER_TEMP/apks.json" \
            '{schema: 1, applicationId: $app, versionCode: $code, versionName: $name, tag: $tag, apk: $apk, size: $size,
              sha256: $sha, apks: $apks[0], minSdk: $minSdk, publishedAt: $at, mandatory: $mandatory, notes: ($notes | rtrimstr("\n"))}' \
            > "$GITHUB_WORKSPACE/dist/update.json"
          cat "$GITHUB_WORKSPACE/dist/update.json"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/
          if-no-files-found: error

      - name: Upload the release notes
        if: ${{ steps.version.outputs.kind == 'release' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

      # R8's mapping turns an obfuscated stack trace from this build back into readable code.
      - name: Upload the R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: r8-mapping
          path: native/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

  release:
    name: GitHub release
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: dist

      - uses: actions/download-artifact@v8
        if: ${{ needs.build.outputs.kind == 'release' }}
        with:
          name: release-notes
          path: notes

      - name: Publish
        env:
          # Publishing to another repository (UPDATE_REPOSITORY) takes a token allowed to write its releases.
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          KIND: ${{ needs.build.outputs.kind }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          here=()
          # The commit and generated notes only mean something in this repository; elsewhere the tag is made there.
          if [ "$UPDATE_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then here=(--target "$GITHUB_SHA"); fi
          if [ "$KIND" = "release" ]; then
            gh release create "$TAG" dist/*.apk dist/*.sha256 dist/update.json \
              --repo "$UPDATE_REPOSITORY" "${here[@]}" \
              --title "NormPix $VERSION" \
              --notes-file notes/release-notes.md \
              --latest
          else
            if [ "$SIGNED" = "true" ]; then
              signing="Signed with the NormPix release key: installs over the app and keeps your data."
            else
              signing="> [!WARNING]
          > Signed with the debug key: it won't install over the app."
            fi
            notes="A test build of main ($GITHUB_SHA), not a release: the app doesn't offer it as an update. Install it by hand to try it.

          $signing"
            if [ "$UPDATE_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then here+=(--generate-notes); fi
            gh release create "$TAG" dist/*.apk dist/*.sha256 \
              --repo "$UPDATE_REPOSITORY" "${here[@]}" \
              --title "NormPix $VERSION (build $GITHUB_RUN_NUMBER)" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          fi
