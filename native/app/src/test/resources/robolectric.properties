# Robolectric's Conscrypt, registered as the first JCA provider, can't verify the JDK's own JCE
# signing certificate on newer JDKs ("Framework jar verification can not be initialized"), which
# breaks every plain-JVM Cipher use that runs after a Robolectric test (FileCardVaultTest).
# The JDK's default providers are all these tests need.
conscryptMode=OFF
