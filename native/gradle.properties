org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
# Kotlin's incremental-cache path resolution throws "different roots" when the
# project (D:) and the Gradle caches (C:) are on different Windows drives.
kotlin.incremental=false
android.suppressUnsupportedCompileSdk=37.0

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
